<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F7F3EB;
      color: #1c1a16;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 1200px;
      height: 630px;
      padding: 72px 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #F7F3EB;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .pill {
      font-size: 18px;
      color: #6f6a5f;
      border: 1.5px solid rgba(28, 26, 22, 0.18);
      border-radius: 999px;
      padding: 10px 22px;
    }
    .hero {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 68px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 980px;
    }
    .sub {
      font-size: 24px;
      line-height: 1.4;
      color: #6f6a5f;
      max-width: 900px;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .url {
      font-size: 18px;
      color: #a39c8d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="name">Sammer Sheikh</div>
      <div class="pill">Applied AI · Full-Stack</div>
    </div>
    <div>
      <div class="hero">Product Engineer at the<br>intersection of systems<br>and design.</div>
    </div>
    <div class="bottom">
      <div class="sub">LLM gateways, agent tooling, regulated medical-device platforms, and native Apple apps.</div>
      <div class="url">sammersheikh.github.io</div>
    </div>
  </div>
</body>
</html>
