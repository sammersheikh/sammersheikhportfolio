<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sammer Sheikh — Portrait</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e8e0d4;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Vignette overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 100;
    }

    .portrait-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .frame-wrapper {
      position: relative;
      width: 320px;
      height: 400px;
      transition: transform 0.3s ease;
    }

    .frame-wrapper.staring {
      animation: stare-pulse 0.4s ease-out;
    }

    @keyframes stare-pulse {
      0% { transform: scale(1); }
      30% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Ornate frame using layered borders and shadows */
    .frame {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      /* Inner gilt edge */
      border: 3px solid #8b7235;
      box-shadow:
        /* Inner glow */
        inset 0 0 20px rgba(139, 114, 53, 0.3),
        /* Outer thin border */
        0 0 0 2px #1a1508,
        /* Outer gilt */
        0 0 0 6px #8b7235,
        /* Outer shadow edge */
        0 0 0 8px #5a4a20,
        /* Deep shadow */
        0 0 0 10px #1a1508,
        /* Baroque outer ridge */
        0 0 0 14px #6b5a28,
        0 0 0 16px #3d3215,
        /* Final outer shadow */
        0 0 30px rgba(0,0,0,0.8),
        0 0 60px rgba(0,0,0,0.5);
    }

    /* Corner ornaments */
    .frame::before, .frame::after {
      content: '❧';
      position: absolute;
      font-size: 28px;
      color: #8b7235;
      opacity: 0.7;
      text-shadow: 0 0 8px rgba(139, 114, 53, 0.5);
    }

    .frame::before {
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
    }

    .frame::after {
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
    }

    .corner {
      position: absolute;
      font-size: 20px;
      color: #8b7235;
      opacity: 0.5;
      z-index: 11;
      pointer-events: none;
    }
    .corner.tl { top: -18px; left: -18px; }
    .corner.tr { top: -18px; right: -18px; transform: scaleX(-1); }
    .corner.bl { bottom: -18px; left: -18px; transform: scaleY(-1); }
    .corner.br { bottom: -18px; right: -18px; transform: scale(-1); }

    /* Pearl beaded inner border */
    .inner-border {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(139, 114, 53, 0.3);
      z-index: 10;
      pointer-events: none;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 6px,
        rgba(139, 114, 53, 0.15) 6px,
        rgba(139, 114, 53, 0.15) 7px
      );
      -webkit-mask-image: linear-gradient(to right, black 0%, transparent 2%, transparent 98%, black 100%),
                          linear-gradient(to bottom, black 0%, transparent 2%, transparent 98%, black 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
    }

    .name-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: rgba(232, 224, 212, 0.25);
      text-transform: uppercase;
      font-weight: 300;
      transition: color 0.5s ease;
    }

    .name-text.staring {
      color: rgba(232, 224, 212, 0.6);
    }

    /* Dust particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(232, 224, 212, 0.15);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* Loading state */
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 1000;
      transition: opacity 0.8s ease;
      gap: 16px;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-bar {
      width: 120px;
      height: 1px;
      background: rgba(139, 114, 53, 0.2);
      position: relative;
      overflow: hidden;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 40%;
      background: rgba(139, 114, 53, 0.7);
      animation: load-sweep 1.2s ease-in-out infinite;
    }

    @keyframes load-sweep {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .loader-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(232, 224, 212, 0.3);
    }

    /* Ambient glow behind frame */
    .ambient-glow {
      position: absolute;
      width: 400px;
      height: 480px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(139, 114, 53, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
      animation: glow-breathe 4s ease-in-out infinite;
    }

    @keyframes glow-breathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .frame-wrapper {
        width: 260px;
        height: 330px;
      }
      .ambient-glow {
        width: 320px;
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="loader-text">preparing portrait…</div>
    <div class="loader-bar"></div>
  </div>

  <!-- Dust particles -->
  <div class="particles" id="particles"></div>

  <!-- Portrait -->
  <div class="portrait-container">
    <div class="ambient-glow"></div>
    <div class="frame-wrapper" id="frameWrapper">
      <canvas id="portrait"></canvas>
      <div class="frame"></div>
      <div class="inner-border"></div>
      <span class="corner tl">✦</span>
      <span class="corner tr">✦</span>
      <span class="corner bl">✦</span>
      <span class="corner br">✦</span>
    </div>
    <div class="name-text" id="nameText">Sammer Sheikh</div>
  </div>

  <script>
    // ─── Config ───
    const IMAGE_PATHS = {
      center: 'images/portrait/face-center.png',
      left:   'images/portrait/face-left.png',
      right:  'images/portrait/face-right.png',
      up:     'images/portrait/face-up.png',
      down:   'images/portrait/face-down.png',
    };

    const STARE_DURATION = 2000;
    const IDLE_DRIFT_SPEED = 0.0008;
    const IDLE_DRIFT_AMOUNT = 0.15;
    const LERP_SPEED = 0.08;
    const STARE_LERP_SPEED = 0.15;

    // ─── State ───
    const images = {};
    let loaded = 0;
    const totalImages = Object.keys(IMAGE_PATHS).length;

    let mouseX = 0.5, mouseY = 0.5; // normalized 0-1
    let currentX = 0, currentY = 0; // lerped values (-1 to 1)
    let targetX = 0, targetY = 0;
    let isStaring = false;
    let stareTimer = null;
    let hasMouse = false;
    let idleTime = 0;

    // ─── Canvas setup ───
    const canvas = document.getElementById('portrait');
    const ctx = canvas.getContext('2d');
    const frameWrapper = document.getElementById('frameWrapper');
    const nameText = document.getElementById('nameText');
    const loader = document.getElementById('loader');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
    }

    // ─── Load images ───
    function loadImages() {
      return new Promise((resolve) => {
        for (const [key, path] of Object.entries(IMAGE_PATHS)) {
          const img = new Image();
          img.onload = () => {
            images[key] = img;
            loaded++;
            if (loaded === totalImages) {
              resolve();
            }
          };
          img.onerror = () => {
            console.error(`Failed to load: ${path}`);
            loaded++;
            if (loaded === totalImages) resolve();
          };
          img.src = path;
        }
      });
    }

    // ─── Particles ───
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 15) + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(p);
      }
    }

    // ─── Input ───
    document.addEventListener('mousemove', (e) => {
      hasMouse = true;
      idleTime = 0;
      mouseX = e.clientX / window.innerWidth;
      mouseY = e.clientY / window.innerHeight;
    });

    document.addEventListener('touchmove', (e) => {
      hasMouse = true;
      idleTime = 0;
      const t = e.touches[0];
      mouseX = t.clientX / window.innerWidth;
      mouseY = t.clientY / window.innerHeight;
    }, { passive: true });

    document.addEventListener('click', () => {
      triggerStare();
    });

    document.addEventListener('touchstart', () => {
      triggerStare();
    }, { passive: true });

    // Device orientation for mobile
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null && e.beta !== null) {
          hasMouse = true;
          idleTime = 0;
          // gamma: left-right tilt (-90 to 90)
          // beta: front-back tilt (-180 to 180)
          mouseX = 0.5 + (e.gamma / 90) * 0.5;
          mouseY = 0.5 + ((e.beta - 45) / 90) * 0.5;
          mouseX = Math.max(0, Math.min(1, mouseX));
          mouseY = Math.max(0, Math.min(1, mouseY));
        }
      });
    }

    function triggerStare() {
      isStaring = true;
      frameWrapper.classList.add('staring');
      nameText.classList.add('staring');

      clearTimeout(stareTimer);
      stareTimer = setTimeout(() => {
        isStaring = false;
        frameWrapper.classList.remove('staring');
        nameText.classList.remove('staring');
      }, STARE_DURATION);
    }

    // ─── Render ───
    function drawFace(img, alpha) {
      if (!img || alpha <= 0.001) return;
      ctx.globalAlpha = alpha;
      // Cover-fit the image into the canvas
      const cw = canvas.width, ch = canvas.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const scale = Math.max(cw / iw, ch / ih);
      const sw = iw * scale, sh = ih * scale;
      const ox = (cw - sw) / 2, oy = (ch - sh) / 2;
      ctx.drawImage(img, ox, oy, sw, sh);
    }

    function render(timestamp) {
      requestAnimationFrame(render);

      // Calculate target
      if (isStaring) {
        targetX = 0;
        targetY = 0;
      } else if (!hasMouse) {
        // Idle drift
        idleTime += 16;
        targetX = Math.sin(idleTime * IDLE_DRIFT_SPEED) * IDLE_DRIFT_AMOUNT;
        targetY = Math.cos(idleTime * IDLE_DRIFT_SPEED * 0.7) * IDLE_DRIFT_AMOUNT * 0.6;
      } else {
        // Mouse tracking: convert 0-1 to -1..1
        targetX = (mouseX - 0.5) * 2;
        targetY = (mouseY - 0.5) * 2;
        // Clamp
        targetX = Math.max(-1, Math.min(1, targetX));
        targetY = Math.max(-1, Math.min(1, targetY));

        // Add subtle idle micro-drift for "aliveness"
        idleTime += 16;
        targetX += Math.sin(idleTime * 0.002) * 0.03;
        targetY += Math.cos(idleTime * 0.0015) * 0.02;
      }

      // Lerp
      const speed = isStaring ? STARE_LERP_SPEED : LERP_SPEED;
      currentX += (targetX - currentX) * speed;
      currentY += (targetY - currentY) * speed;

      // Calculate blend weights
      // Center weight is higher when close to center
      const dist = Math.sqrt(currentX * currentX + currentY * currentY);
      const centerWeight = Math.max(0, 1 - dist * 1.5);

      // Directional weights
      const leftWeight  = Math.max(0, -currentX) * (1 - centerWeight);
      const rightWeight = Math.max(0,  currentX) * (1 - centerWeight);
      const upWeight    = Math.max(0, -currentY) * (1 - centerWeight);
      const downWeight  = Math.max(0,  currentY) * (1 - centerWeight);

      // Normalize
      const total = centerWeight + leftWeight + rightWeight + upWeight + downWeight;
      const norm = total > 0 ? 1 / total : 1;

      // Clear and draw
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;

      // Draw base (center) first, then blend others on top
      drawFace(images.center, centerWeight * norm);
      drawFace(images.left,   leftWeight * norm);
      drawFace(images.right,  rightWeight * norm);
      drawFace(images.up,     upWeight * norm);
      drawFace(images.down,   downWeight * norm);

      ctx.globalAlpha = 1;
    }

    // ─── Init ───
    async function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      createParticles();

      await loadImages();

      // Hide loader
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 800);

      // Start idle drift
      idleTime = performance.now();
      requestAnimationFrame(render);
    }

    init();
  </script>
</body>
</html>
